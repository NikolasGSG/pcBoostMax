name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the
        sections below — the more we know, the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: GameBoostApex version
      description: Visible in `Settings → About`.
      placeholder: "2.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true

  - type: dropdown
    id: admin
    attributes:
      label: Were you running the app as Administrator?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Number them 1, 2, 3 — the smaller the recipe, the better.
      placeholder: |
        1. Open the Optimize tab
        2. Click "Apply selected"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Attach `%LOCALAPPDATA%\GameBoostApexOptimizer\logs\gameboostapex.log` if you
        can — please redact anything personal first. The file is plain JSON
        Lines.
      render: shell
    validations:
      required: false
