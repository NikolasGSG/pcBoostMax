name: Build & Release

# Triggered when you push a tag like `v2.1.0`. Builds the Windows exe with
# PyInstaller, attaches it to a GitHub Release, and produces a stable
# download URL the Microsoft Store / installer mirrors can point at.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:        # let you also build a release manually

permissions:
  contents: write           # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compute version from tag
        id: ver
        shell: bash
        run: |
          # Drop the leading 'v' from the tag for the artifact filename
          TAG=${GITHUB_REF##*/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: python build_exe.py

      - name: Rename artefact for clarity
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          Move-Item dist/GameBoostApex.exe "dist/GameBoostApex-$version-x64.exe"

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $exe = (Resolve-Path "./dist/GameBoostApex-$version-x64.exe").Path
          if (-not (Test-Path $exe)) {
            Get-ChildItem dist
            throw "Built artefact not found at $exe"
          }
          Write-Host "================ binary smoke ================"
          Write-Host "Resolved exe: $exe"
          # The binary is built with PyInstaller --windowed, which makes it
          # a Windows GUI-subsystem app. PowerShell's `& $exe 2>&1` capture
          # cannot read its stdout (the C runtime detaches stdio for GUI
          # apps), and `$LASTEXITCODE` ends up null. Use Start-Process with
          # -Wait -PassThru to reliably get the kernel-level exit code.
          # Output goes to a temp file so we can show it on failure.
          $stdout = Join-Path $env:RUNNER_TEMP "smoke_stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "smoke_stderr.log"
          $proc = Start-Process -FilePath $exe `
              -ArgumentList @("--cli","services","list") `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait -PassThru -WindowStyle Hidden
          $ec = $proc.ExitCode
          Write-Host "Binary exited with code: $ec"
          if (Test-Path $stdout) {
            Write-Host "---- stdout ----"
            Get-Content $stdout | ForEach-Object { Write-Host $_ }
          }
          if (Test-Path $stderr) {
            Write-Host "---- stderr ----"
            Get-Content $stderr | ForEach-Object { Write-Host $_ }
          }
          if ($ec -ne 0) {
            throw "Smoke test failed: binary exited with $ec"
          }
          Write-Host "Smoke test PASSED (binary launched, ran '--cli services list', exited 0)."

      - name: Build Inno Setup installer
        shell: pwsh
        # Microsoft Partner Center, Chocolatey and most app catalogues
        # reject raw PyInstaller .exe files as "not a Win32 package".
        # Wrapping the binary in an Inno Setup installer produces a
        # recognised, signature-detectable installer they accept.
        # Inno Setup 6 is pre-installed on `windows-latest` runners.
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc — runner image changed?"
          }
          Write-Host "================ inno setup ================"
          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceExe=..\dist\GameBoostApex-$version-x64.exe" `
            installer/GameBoostApex.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit $LASTEXITCODE"
          }
          $setup = "dist/GameBoostApex-$version-Setup.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem dist
            throw "Setup installer missing at $setup"
          }
          $size = (Get-Item $setup).Length / 1MB
          Write-Host ("Installer built: {0} ({1:N1} MB)" -f $setup, $size)

      - name: Build MSIX package
        id: msix
        shell: pwsh
        # Microsoft Store rejects EXE/MSI installers under Policy 10.2.9
        # (no installer UI permitted). MSIX bypasses that policy because
        # the Store performs the install itself. Microsoft re-signs the
        # MSIX during submission so we DON'T sign it locally.
        #
        # Identity values come from repo-level vars (Settings → Variables).
        # If any are missing the step is skipped and a warning is emitted —
        # the .exe + Setup.exe artefacts still ship.
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Host "::warning::MSIX_* repo variables not set — skipping MSIX build."
            Write-Host "Set them under Settings → Secrets and variables → Actions → Variables."
            "msix_built=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          # Locate MakeAppx.exe (ships with every Windows SDK on the runner).
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeAppx = Get-ChildItem -Path $sdkRoot -Recurse -Filter "MakeAppx.exe" `
                       -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -match '\\x64\\MakeAppx.exe$' } |
                       Sort-Object FullName -Descending |
                       Select-Object -First 1
          if (-not $makeAppx) {
            throw "MakeAppx.exe not found under $sdkRoot — runner image changed?"
          }
          Write-Host "Using MakeAppx.exe: $($makeAppx.FullName)"

          # 1. Generate the tile assets (idempotent; user-supplied PNGs win).
          New-Item -ItemType Directory -Force -Path msix/Assets | Out-Null
          python tools/build_msix_assets.py msix/Assets

          # 2. Stage the package layout. The exe lives under VFS\ProgramFilesX64
          #    so the manifest's Executable= path resolves on install.
          $stage = "dist/msix-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage/VFS/ProgramFilesX64/GameBoostApex" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/Assets" | Out-Null
          Copy-Item "dist/GameBoostApex-$version-x64.exe" "$stage/VFS/ProgramFilesX64/GameBoostApex/GameBoostApex.exe"
          Copy-Item "msix/Assets/*" "$stage/Assets/" -Recurse

          # 3. Substitute identity + version placeholders in the manifest.
          $manifest = Get-Content "msix/AppxManifest.xml" -Raw
          $manifest = $manifest.Replace('@@MSIX_IDENTITY_NAME@@', $env:MSIX_IDENTITY_NAME)
          $manifest = $manifest.Replace('@@MSIX_PUBLISHER@@', $env:MSIX_PUBLISHER)
          $manifest = $manifest.Replace('@@MSIX_PUBLISHER_DISPLAY_NAME@@', $env:MSIX_PUBLISHER_DISPLAY_NAME)
          $manifest = $manifest.Replace('@@MSIX_VERSION@@', "$version.0")
          Set-Content "$stage/AppxManifest.xml" $manifest -Encoding UTF8

          # 4. Pack.
          $msixPath = "dist/GameBoostApex-$version-x64.msix"
          & $makeAppx.FullName pack /d $stage /p $msixPath /o
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx failed with exit $LASTEXITCODE"
          }
          $size = (Get-Item $msixPath).Length / 1MB
          Write-Host ("MSIX built: {0} ({1:N1} MB)" -f $msixPath, $size)
          "msix_built=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $files = @(
              "dist/GameBoostApex-$version-x64.exe",
              "dist/GameBoostApex-$version-Setup.exe"
          )
          if ("${{ steps.msix.outputs.msix_built }}" -eq "true") {
            $files += "dist/GameBoostApex-$version-x64.msix"
          }
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            $name = Split-Path $f -Leaf
            "$hash  $name" | Out-File -FilePath "$f.sha256" -Encoding ascii
            Write-Host "$name -> $hash"
          }

      - name: Collect artefact paths
        id: paths
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $list = @(
            "dist/GameBoostApex-$version-Setup.exe",
            "dist/GameBoostApex-$version-Setup.exe.sha256",
            "dist/GameBoostApex-$version-x64.exe",
            "dist/GameBoostApex-$version-x64.exe.sha256"
          )
          if ("${{ steps.msix.outputs.msix_built }}" -eq "true") {
            $list += "dist/GameBoostApex-$version-x64.msix"
            $list += "dist/GameBoostApex-$version-x64.msix.sha256"
          }
          $joined = ($list -join "`n")
          "files<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $joined      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GameBoostApex ${{ steps.ver.outputs.version }}
          body: |
            **GameBoostApex ${{ steps.ver.outputs.version }}** — Windows x64 build.

            ## Downloads

            * **`GameBoostApex-${{ steps.ver.outputs.version }}-x64.msix`** —
              Microsoft Store package. Recommended for Microsoft Partner
              Center submission. Bypasses the EXE-installer silent-mode
              policy (10.2.9) entirely — the Store performs the install.
            * **`GameBoostApex-${{ steps.ver.outputs.version }}-Setup.exe`** —
              Inno Setup installer for direct distribution. Per-user
              install, Start Menu shortcut, Apps & Features registration.
            * **`GameBoostApex-${{ steps.ver.outputs.version }}-x64.exe`** —
              Portable single-file binary. No installation, no registry
              entries. Run directly. Useful for USB sticks and IT admins.

            See `CHANGELOG.md` for the full list of changes.

            ## Verifying the download
            ```powershell
            (Get-FileHash -Algorithm SHA256 GameBoostApex-${{ steps.ver.outputs.version }}-x64.msix).Hash
            ```
            should match the value inside the matching `.sha256` file.
          files: ${{ steps.paths.outputs.files }}
          draft: false
          prerelease: false
