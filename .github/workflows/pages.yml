name: Deploy GitHub Pages

# Deploys the static site under /web to GitHub Pages on every push to main.
# This is what hosts:
#   * the project landing page,
#   * the /sponsor/ page where AdSense + Microsoft Ads run legitimately,
#   * the /ads/manifest.json the desktop app fetches,
#   * the /privacy.html public mirror of PRIVACY.md.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'PRIVACY.md'
      - '.github/workflows/pages.yml'
  # Re-deploy whenever the release workflow publishes a new binary, so the
  # /downloads/ mirror stays in sync with the latest GitHub Release.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # GitHub Releases serves binaries via a 302 redirect to its CDN, which
      # Microsoft Partner Center rejects ("not a Win32 Package"). We mirror
      # the latest release's installer + portable exe onto Pages so the
      # install URL is a direct 200 OK with no redirect.
      - name: Mirror latest release binaries to /downloads
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          mkdir -p web/downloads
          LATEST=$(curl -fsSL "https://api.github.com/repos/${GH_REPO}/releases/latest" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('tag_name',''))" || echo "")
          if [ -z "$LATEST" ]; then
            echo "No published release yet — skipping binary mirror."
            exit 0
          fi
          VERSION=${LATEST#v}
          BASE="https://github.com/${GH_REPO}/releases/download/${LATEST}"
          echo "Mirroring ${LATEST} artefacts to Pages /downloads/"

          # 1. Inno Setup installer (canonical Microsoft Partner Center URL).
          SETUP="GameBoost-${VERSION}-Setup.exe"
          if curl -fsSL -o "web/downloads/${SETUP}" "${BASE}/${SETUP}"; then
            curl -fsSL -o "web/downloads/${SETUP}.sha256" "${BASE}/${SETUP}.sha256" || true
            cp "web/downloads/${SETUP}" "web/downloads/GameBoost-latest-Setup.exe"
            [ -f "web/downloads/${SETUP}.sha256" ] && \
              cp "web/downloads/${SETUP}.sha256" "web/downloads/GameBoost-latest-Setup.exe.sha256" || true
          else
            echo "::warning::Setup installer ${SETUP} not found in release ${LATEST}"
          fi

          # 2. Portable PyInstaller exe (legacy / power-user URL).
          EXE="GameBoost-${VERSION}-x64.exe"
          if curl -fsSL -o "web/downloads/${EXE}" "${BASE}/${EXE}"; then
            curl -fsSL -o "web/downloads/${EXE}.sha256" "${BASE}/${EXE}.sha256" || true
            cp "web/downloads/${EXE}" "web/downloads/GameBoost-latest-x64.exe"
            [ -f "web/downloads/${EXE}.sha256" ] && \
              cp "web/downloads/${EXE}.sha256" "web/downloads/GameBoost-latest-x64.exe.sha256" || true
          else
            echo "::warning::Portable exe ${EXE} not found in release ${LATEST}"
          fi

          # 3. MSIX package (Microsoft Store / Partner Center URL).
          MSIX="GameBoost-${VERSION}-x64.msix"
          if curl -fsSL -o "web/downloads/${MSIX}" "${BASE}/${MSIX}"; then
            curl -fsSL -o "web/downloads/${MSIX}.sha256" "${BASE}/${MSIX}.sha256" || true
            cp "web/downloads/${MSIX}" "web/downloads/GameBoost-latest-x64.msix"
            [ -f "web/downloads/${MSIX}.sha256" ] && \
              cp "web/downloads/${MSIX}.sha256" "web/downloads/GameBoost-latest-x64.msix.sha256" || true
          else
            echo "::warning::MSIX ${MSIX} not found — release built before identity vars were configured?"
          fi

          ls -lh web/downloads/

      - name: Upload static site artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
